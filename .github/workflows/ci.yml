# CI pipeline (transformation brief §62). NOTE: this has not been run —
# this development environment has no network access to GitHub Actions'
# runners or any package registry, so it could not be executed or verified
# end-to-end here. It is written to be correct and runnable in a real CI
# environment; treat it as a starting point to validate on your first push,
# not as something already proven green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy bandit pytest pip-audit
      - name: Lint (ruff)
        run: ruff check backend
        continue-on-error: true  # tighten to a hard failure once the existing
                                  # codebase has had a full lint pass; this
                                  # transformation did not run ruff against
                                  # the whole pre-existing backend.
      - name: Type check (mypy)
        run: mypy backend --ignore-missing-imports
        continue-on-error: true  # same caveat as above — not yet a clean baseline.
      - name: Static security analysis (bandit)
        run: bandit -r backend -ll
        continue-on-error: true
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r backend/requirements.txt
        continue-on-error: true  # report, don't block, until triaged once with real network access.
      - name: Unit + security tests (pytest)
        run: pytest tests --maxfail=1 -q
      - name: Backend module tests (pytest)
        run: pytest backend --maxfail=1 -q
        continue-on-error: true  # backend/ has no pytest-style tests of its own yet
                                  # (backend/test_verify.py is a plain script, run below)
      - name: Evaluation framework unit tests
        run: pytest evaluation --maxfail=1 -q
      - name: Repo smoke test
        run: python backend/test_verify.py

  frontend-lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true  # report, don't block, until triaged once with real network access.
      - run: npx tsc --noEmit
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t rag-backend:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t rag-frontend:ci .

# Deployment gate (brief §62): do not deploy on a critical vulnerability,
# high-severity security failure, test failure, or build failure unless
# explicitly approved. This pipeline reports pip-audit/npm audit/bandit
# results but does not yet hard-fail the build on them (see
# `continue-on-error` above) — that switch should be flipped only after a
# first real run has been triaged (existing dependencies reviewed for
# already-known, accepted findings) so day one doesn't block on backlog
# noise that predates this pipeline's existence.
